<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shade — Thomas Brüggemann</title>
  <meta name="description" content="A megacity that grew its own shade: towers crowned with trees, an avenue turned forest, late-afternoon heat haze. A still frame in three.js with small things moving in it.">
  <meta name="theme-color" content="#0a0c10">
  <link rel="canonical" href="https://thomasbrueggemann.com/shade/">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0c10; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
    .ui { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
      display: flex; flex-wrap: wrap; gap: 8px; right: max(16px, env(safe-area-inset-right)); font: 500 14px/1 "Inter Tight", system-ui, sans-serif; transition: opacity .6s; }
    .ui.idle { opacity: 0; }
    .ui a, .ui button { color: #e8e6e1; background: rgba(10,12,16,.55); border: 1px solid rgba(232,230,225,.25);
      padding: 10px 14px; border-radius: 999px; text-decoration: none; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
    .hint { position: fixed; top: max(16px, env(safe-area-inset-top)); left: 0; right: 0; margin: 0; text-align: center; pointer-events: none;
      font: 500 13px/1.3 "Inter Tight", system-ui, sans-serif; letter-spacing: .04em; color: rgba(232,230,225,.75); text-shadow: 0 1px 8px rgba(0,0,0,.6); transition: opacity .6s; }
    .hint.idle { opacity: 0; }
    .ui a:hover, .ui button:hover, .ui a:focus-visible, .ui button:focus-visible { border-color: #e0a96d; color: #e0a96d; outline: none; }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="shade" aria-label="An overgrown megacity in the afternoon heat: towers crowned with trees above a forested avenue and a canal"></canvas>
  <p class="hint" id="hint">Move the mouse to look around · ← →</p>
  <nav class="ui" id="ui">
    <a href="../">← Back</a>
    <button id="fs" type="button">Fullscreen</button>
    <button id="snd" type="button" aria-pressed="false" title="Sound (M)">Sound: off</button>
    <button id="pan" type="button" aria-pressed="false" title="Turn slowly through 360° (P). Move the mouse or use the arrow keys to look around.">Pan 360°</button>
    <button id="gust" type="button" title="Send a gust over the city (G)">Gust</button>
    <button id="down" type="button" aria-pressed="false" title="Down to the river and back (D), or move the pointer into the lower half">Descend</button>
  </nav>
  <script type="module">
    import { startShade3D } from "../js/shade3d.js";
    import { createShadeAudio } from "../js/shade-audio.js";
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const shade = window.__shade = startShade3D(document.getElementById("shade"), { reduced });
    let audio = null;

    const snd = document.getElementById("snd");
    const setSound = async (v) => {
      audio ||= createShadeAudio();
      await audio.set(v);
      snd.textContent = "Sound: " + (v ? "on" : "off");
      snd.setAttribute("aria-pressed", String(v));
    };
    snd.onclick = () => setSound(!(audio && audio.on));

    const gust = () => { shade.gust(); audio?.gust(); };
    document.getElementById("gust").onclick = gust;
    const panBtn = document.getElementById("pan");
    const setPan = (v) => { const on = shade.pan(v); panBtn.textContent = on ? "Panning…" : "Pan 360°"; panBtn.setAttribute("aria-pressed", String(on)); };
    panBtn.onclick = () => setPan();
    const down = document.getElementById("down");
    const toggleDown = () => shade.toggleDescend();
    down.onclick = toggleDown;
    // follow the camera, however it got there: the button label, and the river coming closer in the sound
    setInterval(() => {
      const low = shade.drop > 0.5;
      if (!shade.panning && panBtn.getAttribute("aria-pressed") === "true") setPan(false);     // a touch drag or an arrow key ends the pan
      if (down.textContent !== (low ? "Rise" : "Descend")) { down.textContent = low ? "Rise" : "Descend"; down.setAttribute("aria-pressed", String(low)); }
      if (audio?.on) audio.depth = shade.drop;
    }, 250);

    const ui = document.getElementById("ui"), fs = document.getElementById("fs");
    if (!document.documentElement.requestFullscreen) fs.hidden = true;
    const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    fs.onclick = toggleFs;
    document.addEventListener("fullscreenchange", () => { fs.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen"; });
    addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();
      if (k === "f") toggleFs();
      if (k === "m") snd.click();
      if (k === "g") gust();
      if (k === "d") toggleDown();
      if (k === "p") panBtn.click();
    });

    // controls fade out after a few still seconds
    let t;
    const hint = document.getElementById("hint");
    const wake = () => { ui.classList.remove("idle"); hint.classList.remove("idle"); clearTimeout(t); t = setTimeout(() => { ui.classList.add("idle"); hint.classList.add("idle"); }, 3000); };
    if (matchMedia("(pointer: coarse)").matches) hint.textContent = "Drag to look around";
    let moved = 0;                                       // the hint goes once it has been tried
    addEventListener("pointermove", (e) => { if (e.pointerType === "mouse" && (moved += Math.abs(e.movementX)) > innerWidth * 0.25) hint.hidden = true; }, { passive: true });
    addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") hint.hidden = true; });
    addEventListener("keydown", (e) => { if (e.key.startsWith("Arrow")) hint.hidden = true; });
    ["pointermove", "pointerdown", "keydown"].forEach((ev) => addEventListener(ev, wake, { passive: true }));
    ui.addEventListener("focusin", wake);
    wake();
  </script>
</body>
</html>
