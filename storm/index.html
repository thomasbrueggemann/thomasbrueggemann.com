<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Skerryhead Storm — Thomas Brüggemann</title>
  <meta name="description" content="The lighthouse from the top of thomasbrueggemann.com, fullscreen: a Gerstner sea, storm sky, rain, lightning and a rotating beam in three.js.">
  <meta name="theme-color" content="#0a0c10">
  <link rel="canonical" href="https://thomasbrueggemann.com/storm/">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: #0a0c10; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
    .ui { position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom));
      display: flex; flex-wrap: wrap; gap: 8px; right: max(16px, env(safe-area-inset-right)); font: 500 14px/1 "Inter Tight", system-ui, sans-serif; transition: opacity .6s; }
    .ui.idle { opacity: 0; }
    .ui a, .ui button { color: #e8e6e1; background: rgba(10,12,16,.55); border: 1px solid rgba(232,230,225,.25);
      padding: 10px 14px; border-radius: 999px; text-decoration: none; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
    .ui a:hover, .ui button:hover, .ui a:focus-visible, .ui button:focus-visible { border-color: #e0a96d; color: #e0a96d; outline: none; }
  </style>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
  <canvas id="storm" aria-label="A lighthouse on a rock in a storm at night"></canvas>
  <nav class="ui" id="ui">
    <a href="../">← Back</a>
    <button id="fs" type="button">Fullscreen</button>
    <button id="snd" type="button" aria-pressed="false" title="Sound (M)">Sound: off</button>
    <button id="bolt" type="button" title="Lightning (L)">Lightning</button>
    <button id="boat" type="button" title="Boat (B)">Boat</button>
  </nav>
  <script type="module">
    import { startHero3D } from "../js/hero3d.js";
    import { createStormAudio } from "../js/storm-audio.js";
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let audio = null;
    const hero = window.__hero = startHero3D(document.getElementById("storm"), { reduced, onStrike: (s) => audio?.thunder(s) });

    const snd = document.getElementById("snd");
    const setSound = async (v) => {
      audio ||= createStormAudio();
      await audio.set(v);
      snd.textContent = "Sound: " + (v ? "on" : "off");
      snd.setAttribute("aria-pressed", String(v));
    };
    snd.onclick = () => setSound(!(audio && audio.on));

    const ui = document.getElementById("ui"), fs = document.getElementById("fs");
    if (!document.documentElement.requestFullscreen) fs.hidden = true;
    const toggleFs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
    fs.onclick = toggleFs;
    document.addEventListener("fullscreenchange", () => { fs.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen"; });
    document.getElementById("bolt").onclick = () => hero.strike();
    // a ship in the distance; every SUB_EVERY-th press, a submarine surfaces in front instead
    const SUB_EVERY = 5;
    let boats = 0;
    const boat = () => {
      const sub = ++boats % SUB_EVERY === 0 && hero.surface();
      if (sub) { audio?.surface(sub); return; }
      const ship = hero.ship();
      audio?.horn(ship);
    };
    document.getElementById("boat").onclick = boat;
    addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") toggleFs();
      if (e.key === "l" || e.key === "L") hero.strike();
      if (e.key === "m" || e.key === "M") snd.click();
      if (e.key === "b" || e.key === "B") boat();
    });

    // controls fade out after a few still seconds
    let t;
    const wake = () => { ui.classList.remove("idle"); clearTimeout(t); t = setTimeout(() => ui.classList.add("idle"), 3000); };
    ["pointermove", "pointerdown", "keydown"].forEach((ev) => addEventListener(ev, wake, { passive: true }));
    ui.addEventListener("focusin", wake);
    wake();
  </script>
</body>
</html>
